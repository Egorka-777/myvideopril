name: Highlights cutter
on:
  push:
    branches: [feat/smart-highlights-20261015]
  pull_request:
    paths: ['src/Highlights*.cs', 'tools/highlights/**', 'tests/highlights*', '.github/workflows/highlights.yml']
  workflow_dispatch:
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        shell: pwsh
        run: ./scripts/Install-CiFfmpeg.ps1
      - name: Compile app
        run: dotnet build VideoBatch.csproj -c Release -p:ApplicationIcon=
      - name: Worker contracts and real FFmpeg seek/export
        run: |
          python -m pip install Pillow==11.3.0
          python tests/highlights_test.py
      - name: Windows UI and screenshots
        shell: powershell
        run: |
          $asm = [Reflection.Assembly]::LoadFrom((Resolve-Path bin/Release/net48/VideoBatch.exe).Path)
          $folder = Join-Path (Get-Location) 'artifacts/highlights-preview'
          if (!$asm.GetType('VideoBatch.HighlightsTests').GetMethod('RunUiTests').Invoke($null,[object[]]@([string]$folder))) { throw 'UI regression' }
      - name: Package desktop update
        shell: pwsh
        run: |
          $folder = 'artifacts/VideoBatch-Highlights'
          New-Item -ItemType Directory -Force "$folder/tools" | Out-Null
          Copy-Item bin/Release/net48/VideoBatch.exe* $folder
          Copy-Item tools/highlights "$folder/tools" -Recurse
          Copy-Item docs/AGENT_HIGHLIGHTS_20261015_RU.md $folder
          git rev-parse HEAD | Set-Content "$folder/SOURCE_COMMIT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: VideoBatch-Highlights-Update
          path: artifacts/VideoBatch-Highlights
      - uses: actions/upload-artifact@v4
        with:
          name: Highlights-UI
          path: artifacts/highlights-preview
  local-models:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg zstd
          python -m pip install -r tools/highlights/requirements.txt
      - name: Install Ollama for isolated local integration
        run: |
          curl --fail --location --retry 3 https://github.com/ollama/ollama/releases/download/v0.40.4/ollama-linux-amd64.tar.zst -o /tmp/ollama.tar.zst
          mkdir /tmp/ollama-test
          tar --zstd -xf /tmp/ollama.tar.zst -C /tmp/ollama-test
      - name: Real speech and local semantic/vision inference
        env:
          HIGHLIGHTS_OLLAMA: /tmp/ollama-test/bin/ollama
          OLLAMA_NO_CLOUD: '1'
        run: python tests/highlights_models.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Highlights-Local-Models-Report
          path: artifacts/highlights-models

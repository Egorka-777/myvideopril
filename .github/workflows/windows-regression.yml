name: VideoBatch Windows regression
on:
  push:
    branches: [fix/tiktok-caption-watch-completeness-20260921, fix/tiktok-evidence-20260929]
  pull_request:
    paths:
      - 'src/**'
      - 'tools/uploader/**'
      - 'tests/**'
      - 'VideoBatch.csproj'
      - '.github/workflows/windows-regression.yml'
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install worker dependency
        run: npm ci --prefix tools/uploader --ignore-scripts
      - name: Node regressions
        shell: pwsh
        run: |
          Get-ChildItem tests -Filter *.js | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed: $($_.Name)" }
          }
      - name: Compile desktop application
        run: dotnet build VideoBatch.csproj -c Release -p:ApplicationIcon=
      - name: C# self tests
        shell: powershell
        run: |
          $asm = [Reflection.Assembly]::LoadFrom((Resolve-Path ./bin/Release/net48/VideoBatch.exe).Path)
          $tests = $asm.GetType('VideoBatch.HttpRegressionSelfTests')
          $ok = $tests.GetMethod('RunAll').Invoke($null, $null)
          if (!$ok) { throw 'C# self tests returned false' }
      - name: Upload compiled desktop and source workers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-20261001-with-workers
          path: |
            bin/Release/net48/VideoBatch.exe
            bin/Release/net48/VideoBatch.exe.config
            tools/uploader/*.js
            tools/uploader/package*.json
            tools/uploader/tiktok-sign/*.js
            docs/ROLLOUT_20261001_RU.md
            scripts/Build-Desktop-20261001.ps1

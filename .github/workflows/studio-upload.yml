name: YouTube Studio RU EN upload
on:
  push:
    branches: [main, fix/studio-upload-recovery-20261022, feat/studio-upload-ru-en-20261015, fix/youtube-studio-startup-20261016, fix/studio-details-chain-20261016, fix/studio-state-flow-20261019, feat/telegram-profile-templates-20261019, feat/studio-publish-workflow-20261021, fix/studio-schedule-chips-20261021, fix/studio-timezone-finish-20261021, fix/studio-editor-focus-20261021, fix/studio-shorts-queue-20261021, fix/studio-description-stability-20261021]
  pull_request:
    paths: ['src/Uploader.cs','src/QueueManager.cs','src/TaskQueueStore.cs','src/TitleCleaner.cs','src/YouTubeMetadata.cs','src/StudioUploadTests.cs','src/YouTubeOwnerPublish.cs','src/YouTubeOwnerPublishTests.cs','tools/uploader/studio-browser.js','tools/uploader/studio-schedule-controls.js','tools/uploader/studio-timezone-controls.js','tools/uploader/studio-editor-controls.js','tools/uploader/youtube-studio-upload.js','tools/uploader/youtube-owner-publish.js','tools/uploader/youtube-thumbnail.js','tools/uploader/worker.js','tests/browser/studio-startup.js','tests/browser/studio-details-chain.js','tests/browser/studio-state-flow.js','tests/browser/studio-schedule-chips.js','tests/browser/studio-timezone-finish.js','tests/browser/studio-editor-focus.js','tests/browser/studio-shorts-queue.js','tests/browser/studio-description-stability.js','tests/browser/studio-upload-recovery.js','scripts/Collect-StudioDiagnostics.ps1','tools/uploader/studio-run-audit.js','scripts/Sync-StudioUploader.ps1','tests/browser/youtube-owner-publish.js','tests/browser/youtube-studio-upload.js','.github/workflows/studio-upload.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools/uploader --ignore-scripts
      - name: Existing Node regressions
        shell: pwsh
        run: |
          Get-ChildItem tests -Filter *.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { throw $_.Name } }
      - name: Shorts upload and close regressions
        timeout-minutes: 4
        shell: pwsh
        run: |
          npx --prefix tools/uploader playwright-core install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium install' }
          node tests/browser/studio-shorts-queue.js
          if ($LASTEXITCODE -ne 0) { throw 'Shorts queue' }
      - name: Compile desktop
        run: dotnet build VideoBatch.csproj -c Release -p:ApplicationIcon=
      - name: Desktop payload, storage and scheduler regressions
        shell: powershell
        run: |
          $asm = [Reflection.Assembly]::LoadFrom((Resolve-Path bin/Release/net48/VideoBatch.exe).Path)
          foreach ($name in @('StudioUploadTests','TitleCleaner','ScheduleGenerator')) {
            if (!$asm.GetType('VideoBatch.'+$name).GetMethod('RunSelfTests').Invoke($null,@())) { throw $name }
          }
          if (!$asm.GetType('VideoBatch.HttpRegressionSelfTests').GetMethod('RunThumbnailFallbackSelfTest').Invoke($null,@())) { throw 'Thumbnail fallback' }
      - name: Sync installed uploader self-test
        shell: powershell
        run: ./tests/Sync-StudioUploader.Tests.ps1
      - name: Studio recovery evidence
        timeout-minutes: 6
        shell: pwsh
        run: |
          node tests/browser/studio-upload-recovery.js
          if ($LASTEXITCODE -ne 0) { throw 'Studio recovery' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-Recovery-Evidence
          path: artifacts/studio-recovery
          if-no-files-found: ignore
      - name: Description 3 plus 3 evidence
        timeout-minutes: 8
        shell: powershell
        run: |
          $folder = 'artifacts/studio-description'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $asm = [Reflection.Assembly]::LoadFrom((Resolve-Path bin/Release/net48/VideoBatch.exe).Path)
          $type = $asm.GetType('VideoBatch.YouTubeDescriptionTemplates')
          $prefs = [Activator]::CreateInstance($asm.GetType('VideoBatch.Preferences'))
          $list = New-Object 'System.Collections.Generic.List[string]'
          foreach ($value in $type.GetMethod('DefaultsRu').Invoke($null,@())) { $list.Add($value) }
          $prefs.YouTubeDescriptionBankRu = $list
          $banks = @{source='compiled YouTubeMetadata.Build';descriptionMarket='RU'}
          foreach ($locale in @('ru','en')) {
            $channel = [Activator]::CreateInstance($asm.GetType('VideoBatch.YouTubeChannel'))
            $channel.Market = 'RU'; $channel.ProfileId = 'description-fixture-' + $locale
            $descriptions = @()
            foreach ($index in 1..3) {
              $record = $asm.GetType('VideoBatch.YouTubeMetadata').GetMethod('Build').Invoke($null,@($prefs,$channel,$index))
              $descriptions += $record.Item2
            }
            $banks[$locale] = $descriptions
          }
          $banks | ConvertTo-Json -Depth 5 | Set-Content "$folder/input-banks.json" -Encoding UTF8
          $env:STUDIO_DESCRIPTION_BANKS = [IO.Path]::GetFullPath("$folder/input-banks.json")
          $env:STUDIO_EVIDENCE_DIR = [IO.Path]::GetFullPath($folder)
          node tests/browser/studio-description-stability.js
          if ($LASTEXITCODE -ne 0) { throw 'Description stability' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-Description-Evidence
          path: artifacts/studio-description
          if-no-files-found: ignore
      - name: Native browser upload flow fixtures
        timeout-minutes: 10
        shell: pwsh
        run: |
          npx --prefix tools/uploader playwright-core install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium install' }
          foreach ($name in @('studio-editor-focus','studio-timezone-finish','studio-schedule-chips','youtube-owner-publish','studio-startup','studio-cdp-stall','studio-details-chain','studio-state-flow','youtube-studio-upload','publishing-ui','native_calendar','dolphin_lifecycle')) {
            node "tests/browser/$name.js"
            if ($LASTEXITCODE -ne 0) { throw $name }
          }
      - name: Native author publication UI
        shell: powershell
        run: |
          $asm = [Reflection.Assembly]::LoadFrom((Resolve-Path bin/Release/net48/VideoBatch.exe).Path)
          if (!$asm.GetType('VideoBatch.YouTubeOwnerPublishTests').GetMethod('RunUiTests').Invoke($null,@([IO.Path]::GetFullPath('artifacts/studio-owner-ui')))) { throw 'Owner publish UI' }
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Owner-UI
          path: artifacts/studio-owner-ui
      - name: Package desktop update
        shell: pwsh
        run: |
          $dest = 'artifacts/VideoBatch-Studio-Upload'
          New-Item -ItemType Directory -Force "$dest/tools/uploader" | Out-Null
          Copy-Item bin/Release/net48/VideoBatch.exe* $dest
          Copy-Item bin/Release/net48/*.dll $dest
          if (Test-Path bin/Release/net48/runtimes) { Copy-Item bin/Release/net48/runtimes $dest -Recurse }
          New-Item -ItemType Directory -Force "$dest/tools/telegram" | Out-Null
          Copy-Item tools/telegram/* "$dest/tools/telegram" -Recurse -Force
          Copy-Item tools/uploader/*.js "$dest/tools/uploader"
          Copy-Item tools/uploader/package*.json "$dest/tools/uploader"
          Copy-Item docs/AGENT_STUDIO_UPLOAD_20261015_RU.md $dest
          Copy-Item docs/AGENT_STUDIO_STARTUP_20261016_RU.md $dest
          Copy-Item docs/AGENT_STUDIO_DETAILS_20261016_RU.md $dest
          Copy-Item docs/AGENT_STUDIO_STATE_20261019_RU.md $dest
          Copy-Item docs/AGENT_STUDIO_PUBLISH_20261021_RU.md $dest
          Copy-Item docs/AGENT_STUDIO_CHIPS_20261021_RU.md $dest
          Copy-Item docs/AGENT_STUDIO_TIMEZONE_20261021_RU.md $dest
          Copy-Item docs/AGENT_STUDIO_EDITOR_20261021_RU.md $dest
          Copy-Item docs/AGENT_STUDIO_SHORTS_20261021_RU.md $dest
          Copy-Item docs/AGENT_STUDIO_HANDOFF_20261021_RU.md $dest
          New-Item -ItemType Directory -Path "$dest/scripts" -Force | Out-Null
          Copy-Item scripts/Sync-StudioUploader.ps1,scripts/Collect-StudioDiagnostics.ps1 "$dest/scripts"
          Copy-Item docs/AGENT_STUDIO_RECOVERY_20261022_RU.md $dest
          Copy-Item docs/AGENT_WARMUP_VIDEO_20261021_RU.md $dest
          git rev-parse HEAD | Set-Content "$dest/SOURCE_COMMIT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: VideoBatch-Studio-v20-Update
          path: artifacts/VideoBatch-Studio-Upload

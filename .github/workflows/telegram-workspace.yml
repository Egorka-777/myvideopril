name: Telegram workspace
on:
  push:
    branches: [feat/telegram-workspace-20261015, feat/telegram-connect-proxies-20261016, feat/telegram-status-invites-20261016, feat/telegram-polish-20261016, fix/telegram-connect-flow-20261017]
  pull_request:
    paths: ['src/Telegram*.cs','tools/telegram/**','tests/telegram/**','src/AppShell.cs','src/NavigationService.cs','.github/workflows/telegram-workspace.yml']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare actual Windows runtime
        shell: powershell
        run: |
          ./tools/telegram/setup.ps1 -Root "$env:RUNNER_TEMP/telegram-runtime"
          if ($LASTEXITCODE -ne 0) { throw 'Setup' }
      - name: Offline import and RPC queue tests
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP/telegram-runtime/venv/Scripts/python.exe" -m unittest discover -s tests/telegram -v
          if ($LASTEXITCODE -ne 0) { throw 'Telegram tests' }
      - name: Compile desktop
        run: dotnet build VideoBatch.csproj -c Release -p:ApplicationIcon=
      - name: Windows vault, serialization and UI tests
        shell: powershell
        run: |
          $env:VIDEOBATCH_HOME = $PWD.Path
          $asm = [Reflection.Assembly]::LoadFrom((Resolve-Path bin/Release/net48/VideoBatch.exe).Path)
          foreach ($name in @('TelegramTests','TelegramConnectTests','TelegramStatusTests','StudioUploadTests','TitleCleaner','ScheduleGenerator')) {
            Write-Host "Running $name"
            if (!$asm.GetType('VideoBatch.'+$name).GetMethod('RunSelfTests').Invoke($null,@())) { throw $name }
          }
          if (!$asm.GetType('VideoBatch.AssemblyMarketTests').GetMethod('RunInitializationTests').Invoke($null,@())) { throw 'Assembly repeated initialization' }
          if (!$asm.GetType('VideoBatch.AccountLibraryTests').GetMethod('RunSyncTests').Invoke($null,@())) { throw 'Account library sync' }
          Write-Host 'Running real worker protocol'
          if (!$asm.GetType('VideoBatch.TelegramTests').GetMethod('RunWorkerProtocolTest').Invoke($null,@("$env:RUNNER_TEMP/telegram-runtime"))) { throw 'Desktop worker protocol' }
          Write-Host 'Running native WebView2'
          if (!$asm.GetType('VideoBatch.TelegramStatusTests').GetMethod('RunBrowserTest').Invoke($null,@())) { throw 'Native WebView2 proxy/QR integration' }
          $dest = Join-Path $PWD 'artifacts/telegram-ui'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Write-Host 'Running Telegram UI capture'
          $asm.GetType('VideoBatch.TelegramTests').GetMethod('RunUiTest').Invoke($null,@([string]$dest))
          Write-Host 'Running shared shell capture'
          if (!$asm.GetType('VideoBatch.TelegramStatusTests').GetMethod('RunShellLayoutTest').Invoke($null,@([string]$dest))) { throw 'Shared shell layout' }
      - name: Existing JS regressions
        shell: pwsh
        run: |
          npm ci --prefix tools/uploader --ignore-scripts
          Get-ChildItem tests -Filter *.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { throw $_.Name } }
          node tests/browser/youtube-interaction-safety.js
          if ($LASTEXITCODE -ne 0) { throw 'Native advertising safety' }
      - name: Package update
        shell: pwsh
        run: |
          $dest = 'artifacts/VideoBatch-Telegram-Update'
          New-Item -ItemType Directory -Force "$dest/tools/telegram" | Out-Null
          New-Item -ItemType Directory -Force "$dest/tools/uploader" | Out-Null
          Copy-Item bin/Release/net48/VideoBatch.exe*,bin/Release/net48/*.dll $dest
          if (Test-Path bin/Release/net48/runtimes) { Copy-Item bin/Release/net48/runtimes "$dest/runtimes" -Recurse }
          Copy-Item tools/telegram/*.py,tools/telegram/*.ps1,tools/telegram/*.txt "$dest/tools/telegram"
          Copy-Item tools/uploader/*.js,tools/uploader/package*.json "$dest/tools/uploader"
          Copy-Item docs/AGENT_TELEGRAM_CONNECT_20261017_RU.md $dest
          git rev-parse HEAD | Set-Content "$dest/SOURCE_COMMIT.txt"
          foreach ($entry in @(@('x86',0x014c),@('x64',0x8664))) {
            $native = Join-Path $dest ('runtimes/win-'+$entry[0]+'/native/WebView2Loader.dll')
            if (!(Test-Path $native)) { throw "Missing packaged WebView2 loader: $($entry[0])" }
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $native))
            $pe = [BitConverter]::ToInt32($bytes,0x3c)
            if ([BitConverter]::ToUInt16($bytes,$pe+4) -ne $entry[1]) { throw "Wrong packaged loader architecture: $($entry[0])" }
          }
      - name: Native browser from packaged update
        shell: powershell
        run: |
          $folder = (Resolve-Path artifacts/VideoBatch-Telegram-Update).Path
          $arch = if ([IntPtr]::Size -eq 8) { 'x64' } else { 'x86' }
          $loader = Join-Path $folder "runtimes/win-$arch/native"
          $core = [Reflection.Assembly]::LoadFrom((Join-Path $folder 'Microsoft.Web.WebView2.Core.dll'))
          $core.GetType('Microsoft.Web.WebView2.Core.CoreWebView2Environment').GetMethod('SetLoaderDllFolderPath').Invoke($null,@([string]$loader))
          $asm = [Reflection.Assembly]::LoadFrom((Join-Path $folder 'VideoBatch.exe'))
          if (!$asm.GetType('VideoBatch.TelegramStatusTests').GetMethod('RunBrowserTest').Invoke($null,@())) { throw 'Packaged WebView2 integration' }
          Write-Host "Packaged WebView2 loader verified: $arch"
      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-Connect-Update
          path: artifacts/VideoBatch-Telegram-Update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Telegram-UI
          path: artifacts/telegram-ui

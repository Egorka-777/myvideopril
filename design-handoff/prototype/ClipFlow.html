let projects=[],p=null,page='home',tab='files',selected=0,layer=0,scene=0,stageIndex=0,analysisOpen=false,playing=false,uploadTo='a',modalSave=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const R=()=>recipes.find(r=>r.id===p.type);const navItems=[['home','folder','Проекты'],['tools','sliders','Инструменты'],['results','film','Результаты'],['history','history','Связки'],['publish','send','Публикации'],['accounts','users','Аккаунты'],['checker','shield','Чекер'],['stats','chart','Статистика'],['tasks','list','Задачи'],['settings','settings','Настройки']];
function notify(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.nt);window.nt=setTimeout(()=>$('toast').style.display='none',2800)}function nav(){ $('nav').innerHTML=`<div class="brand"><div class="logo">${I('logo')}</div>ClipFlow</div><div class="group">ПРОИЗВОДСТВО</div>${navItems.map(([id,i,t],j)=>(j===4?'<div class="group">УПРАВЛЕНИЕ</div>':'')+`<button class="nav ${page===id||page==='project'&&id==='home'?'active':''}" onclick="go('${id}')">${I(i)}${t}</button>`).join('')}<div class="spacer"></div><div class="small muted" style="padding:8px 12px">Дизайн-прототип · локально</div>`}function headerBar(t){return `<header class="top"><div class="row"><b>${t}</b></div><div class="row"><span class="muted">Демонстрационный режим</span><button class="ghost" onclick="go('tasks')">Задачи</button></div></header>`}function go(id){page=id;render()}function art(id){let a=`<div class="phone"><img src="${assets.a}"></div>`,b=`<div class="phone"><img src="${assets.b}"></div>`,s=`<div class="phone split"><img src="${assets.a}"><img src="${assets.b}"></div>`;if(id==='split')return a+b+'<span>→</span>'+s;if(id==='creative')return a+'<span>→</span>'+`<div class="phone"><img src="${assets.a}"><div class="cap">Вступление</div></div><div class="phone"><img src="${assets.a}"><div class="comment">Комментарий<br>────────</div></div>`;if(id==='translate')return a+'<span>→</span>'+`<div class="phone"><img src="${assets.a}"><div class="cap">Новый язык</div></div>`;if(id==='story')return `<div class="phone wide"><img src="${assets.a}"></div><span>→</span>${b}<div class="phone"><img src="${assets.b}"><div class="cap">Новый рассказ</div></div>`;return a+b+s}
function home(){return headerBar('Рабочее пространство')+`<div class="content"><section class="hero panel"><div class="iconBig">${I('spark')}</div><div class="flex"><h1>Создать видео</h1><p>Добавь свои материалы. Помощник предложит подходящий способ монтажа.</p></div><button class="primary" onclick="chooseRecipe()">Новый проект +</button></section><section class="section"><h2>Пять сценариев</h2><div class="recipes">${recipes.map(r=>`<button class="recipe" onclick="newProject('${r.id}')"><div class="art">${art(r.id)}</div><div class="copy"><h3>${r.name}</h3><p>${r.desc}</p></div></button>`).join('')}</div></section><section class="section"><div class="row between"><h2>Мои проекты</h2><button class="ghost" onclick="demoProject('creative')">Открыть демо</button></div>${projects.length?projects.map((x,i)=>`<div class="project" onclick="openProject(${i})">${I(recipes.find(r=>r.id===x.type).i)}<div class="flex"><b>${esc(x.name)}</b><p class="small">${recipes.find(r=>r.id===x.type).name} · ${x.files.length} видео</p></div><span class="pill">${x.format}</span><span class="muted">›</span></div>`).join(''):'<div class="empty"><p>Здесь появятся сохранённые проекты. Настрой один раз и добавляй новые материалы без повторного мастера.</p><button onclick="demoProject(\'creative\')">Посмотреть пример</button></div>'}</section></div>`}function chooseRecipe(){modal('Новый проект',recipes.map(r=>`<button class="action" onclick="closeModal();newProject('${r.id}')">${I(r.i)}<span class="flex"><b>${r.name}</b><br><span class="small muted">${r.desc}</span></span>›</button>`).join(''),null,'Закрыть')}
function makeFile(name,url='',demo=false){return {name,url,demo,comment:false,comments:[],intro:'',trans:[{scale:1,x:0,y:0},{scale:1,x:0,y:0}],subtitle:'',notes:''}}function baseNew(type,demo=false){p={type,name:recipes.find(r=>r.id===type).name,format:'9:16',files:[],secondary:[],split:.5,layout:'vertical',audio:'original',voice:'',language:'ru',subs:false,subStyle:'white',overlay:'none',effects:'none',music:'',processing:false,translate:false,scenes:[{name:'Сцена 1',duration:5,layers:[]}],settings:{},demo};projects.push(p);selected=layer=scene=stageIndex=0;tab='files';page='project';if(demo){p.name='Демо · '+R().name;p.files=[makeFile('interview_01.mp4',assets.a,true),makeFile('interview_02.mp4',assets.a,true),makeFile('interview_03.mp4',assets.a,true)];p.secondary=[makeFile('background.mp4',assets.b,true)];if(type==='creative'){p.files[0].comment=true;p.files[0].comments=['Пример комментария 1','Пример комментария 2','Пример комментария 3'];}}render()}function demoProject(t){newProject(t,true)}function baseOpen(i){p=projects[i];tab='files';page='project';selected=layer=scene=stageIndex=0;render()}function changeTab(t){tab=t;render()}function f(){return p.files[selected]}function addFiles(dest='a'){uploadTo=dest;$('upload').click()}$('upload').onchange=e=>{if(!p)return;let dest=uploadTo==='b'?p.secondary:p.files;for(let file of e.target.files)dest.push(makeFile(file.name,URL.createObjectURL(file)));e.target.value='';render()};function addDemo(){p.files.push(makeFile('example_'+(p.files.length+1)+'.mp4',assets.a,true));if(p.type==='split'&&!p.secondary.length)p.secondary.push(makeFile('background.mp4',assets.b,true));render()}function selectFile(i){selected=i;layer=0;render()}function removeFile(i){p.files.splice(i,1);selected=Math.max(0,Math.min(selected,p.files.length-1));render()}function filelist(){return p.files.map((x,i)=>`<div class="file ${selected===i?'on':''}" onclick="selectFile(${i})">${x.demo?`<img class="thumb" src="${esc(x.url||assets.a)}">`:`<div class="thumb thumbicon">${I('film')}</div>`}<span class="flex">${esc(x.name)}</span>${x.comment?'✓':''}</div>`).join('')}
function baseProject(){let r=R();return headerBar(`<span class="muted" onclick="go('home')" style="cursor:pointer">Проекты</span> &nbsp; / &nbsp; ${esc(p.name)}`)+`<div class="toolbar"><div class="tabs">${[['files','Материалы'],['plan','Оформление'],['edit','Монтаж'],['review','Проверка']].map(([id,t])=>`<button class="tab ${tab===id?'on':''}" onclick="changeTab('${id}')">${t}</button>`).join('')}</div><div class="spacer"></div><button onclick="openSettings('project')">${esc(p.format)} ▾</button><button onclick="openAI()">✦ Помощник</button></div><div class="workspace">${tab==='edit'?editor():`<div class="workbody">${tab==='files'?materialPage():tab==='plan'?planPage():reviewPage()}</div>`}<div class="bottomBar"><div class="row"><span class="muted small">${p.files.length} видео · ${p.format}</span><span class="pill">${r.id==='story'?'Новая связка':'Существующий движок'}</span></div><div class="row"><button onclick="saveProject()">Сохранить</button>${tab==='review'?'<button class="primary" onclick="openSettings(\'export\')">Собрать ролики</button>':`<button class="primary" onclick="changeTab('${({files:'plan',plan:'edit',edit:'review'})[tab]}')">${({files:'Оформление',plan:'Открыть монтаж',edit:'Проверить'})[tab]} →</button>`}</div></div></div>`}
function materialPage(){let c=p.type==='creative';return `<div class="pageTitle"><div><h1>Материалы</h1><p>${c?'Добавь видео и комментарии к каждому ролику.':'Добавь исходные материалы для массовой сборки.'}</p></div><div class="row"><button onclick="openSettings('links')">Ссылки</button><button class="primary" onclick="addFiles()">+ Видео</button></div></div>${p.type==='split'?`<div class="row" style="margin-bottom:15px"><div class="panel flex"><h3>Основные видео</h3><p>${p.files.length} файлов</p><button onclick="addFiles()">Добавить</button></div><div class="panel flex"><h3>Вторые видео</h3><p>${p.secondary.length} файлов</p><button onclick="addFiles('b')">Добавить</button></div></div>`:''}${p.files.length?`<div class="tablewrap"><table><thead><tr><th>Видео</th>${c?'<th>Комментарии</th>':''}<th>Анализ</th><th></th></tr></thead><tbody>${p.files.map((x,i)=>`<tr><td><div class="row"><img class="thumb" src="${assets.a}"><b>${esc(x.name)}</b></div></td>${c?`<td><button onclick="selected=${i};openSettings('comments')">${x.comment?'✓ Проверить':'Сфотографировать'}</button></td>`:''}<td><span class="muted">${x.demo?'Демо-материал':'Не выполнен'}</span></td><td><button onclick="selectFile(${i});changeTab('edit')">Монтаж</button> <button class="ghost" onclick="removeFile(${i})">✕</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty" ondragover="event.preventDefault()" ondrop="dropFiles(event)"><h2>Перетащи видео сюда</h2><p>Можно выбрать сразу несколько файлов.</p><button class="primary" onclick="addFiles()">Выбрать файлы</button> <button onclick="addDemo()">Демо</button></div>`}${c?'<p class="note">Комментарий: действующий захват экрана → Ctrl+V → проверка трёх карточек. В браузерном макете захват не подключён.</p>':''}<div class="hint"><div class="row"><span>✦</span><b>Помощник</b></div><p>Сначала анализирует реальные материалы и проверяет, какие операции доступны. Без анализа не выдаёт персональные рекомендации.</p><button style="margin-top:9px" onclick="openAI()">Открыть</button></div>`}function dropFiles(e){e.preventDefault();for(let x of e.dataTransfer.files)if(x.type.startsWith('video/'))p.files.push(makeFile(x.name,URL.createObjectURL(x)));render()}
const tool=(i,t,d,k)=>`<button class="tool" style="white-space:normal;text-align:left" onclick="openSettings('${k}')">${I(i)}<span class="flex"><b>${t}</b><p>${d}</p></span><span class="muted">›</span></button>`;
function planPage(){let r=R();return `<div class="pageTitle"><div><h1>Оформление</h1><p>Общие настройки проекта. Индивидуальные изменения — в монтаже.</p></div><button onclick="openAI()">✦ Идеи помощника</button></div>${p.type==='creative'?`<div class="panel" style="margin-bottom:16px"><div class="row between"><h2>Структура ролика</h2><span class="pill">До 3 сек. вступление</span></div><div class="row" style="margin-top:16px;gap:15px">${['Вступление','Mix','Оригинал','Комментарии'].map((t,i)=>`<div class="flex col" style="align-items:center"><div class="art" style="width:100%;border-radius:8px;height:110px">${i===3?'<div class="phone"><img src="'+assets.a+'"><div class="comment">Комментарий</div></div>':'<div class="phone"><img src="'+assets.a+'"></div>'}</div><b>${t}</b></div>`).join('<span class="muted">→</span>')}</div></div>`:''}<div class="tools">${p.type==='creative'?tool('mic','Вступление','Контекст, текст, прослушивание','intro'):''}${p.type==='translate'||p.type==='story'?tool('lang',p.type==='story'?'Сценарий':'Перевод оригинала','Язык, речь, смысл','translation'):''}${tool('audio','Звук',p.audio==='original'?'Исходный звук':'Новая аудиокомпозиция','audio')}${tool('mic','Голос',p.voice||'Выбор ElevenLabs','voice')}${tool('captions','Субтитры',p.subs?'Включены':'Выключены','subs')}${tool('layers','Вставки','Изображения, графика, рекламная пауза','overlay')}${tool('sliders','Эффекты','Цвет и техническая обработка','processing')}${p.type==='split'?tool('split','Раскладка','Положение, стык и источники','layout'):''}${p.type==='creative'?tool('lang','Язык озвучки',p.translate?'Перевод вступления и комментариев':'Авто по исходному заголовку','translation'):''}${tool('settings','Экспорт','Формат, заголовки, папка','export')}</div><div class="hint"><b>Необязательные операции</b><p>Помощник предлагает только подходящие операции. Настройки не требуется открывать все подряд.</p></div>`}
function act(i,t,k){return `<button class="action" onclick="openSettings('${k}')">${I(i)}<span>${t}</span><span class="right">›</span></button>`}function baseEditor(){let x=f(),isSplit=p.type==='split',construct=p.type==='construct';return `<div class="editor"><aside class="files"><div class="row between"><b>Видео</b><button onclick="addFiles()">+</button></div><div style="margin-top:12px">${filelist()||'<p class="small muted">Нет материалов</p>'}</div>${isSplit?'<hr style="border:0;border-top:1px solid #45474d"><p class="small">Вторые видео · '+p.secondary.length+'</p><button style="width:100%;margin-top:8px" onclick="addFiles(\'b\')">+ Добавить</button>':''}${construct?`<div class="section"><h3>Слои сцены</h3>${p.scenes[scene].layers.map((l,i)=>`<button class="action" onclick="openSettings('layer${i}')">${esc(l)} ›</button>`).join('')}<button class="action" onclick="openSettings('layerNew')">+ Слой</button></div>`:''}</aside><section class="center"><div class="stage" id="stage"><div id="canvas" class="canvas">${x?canvasContent():`<div style="display:grid;place-items:center;height:100%;color:#92959d">Нет видео</div>`}</div></div><div class="transport"><button onclick="playToggle()" title="Воспроизвести">▶</button><span class="small muted" id="time">00:00</span><input id="seek" type="range" min="0" max="100" value="0" oninput="seek(this.value)"><button onclick="fullScreen()" title="Развернуть">⛶</button></div>${construct?`<div class="sceneStrip">${p.scenes.map((s,i)=>`<button class="${scene===i?'on':''}" onclick="scene=${i};render()">${esc(s.name)} · ${s.duration}с</button>`).join('')}<button onclick="p.scenes.push({name:'Сцена '+(p.scenes.length+1),duration:5,layers:[]});scene=p.scenes.length-1;render()">+ Сцена</button></div>`:p.type==='creative'?`<div class="sceneStrip">${['Вступление','Оригинал','Комментарии'].map((s,i)=>`<button class="${stageIndex===i?'on':''}" onclick="stageIndex=${i};render()">${s}</button>`).join('')}</div>`:''}</section><aside class="inspector"><div class="row between"><b>${isSplit?layer===0?'Видео 1':'Видео 2':'Монтаж'}</b><span class="muted small">${p.format}</span></div><p class="small muted" style="margin-top:9px">Перетаскивай кадр мышью. Колёсико меняет размер.</p>${isSplit?`<div class="choices" style="margin-top:12px"><button class="${layer===0?'on':''}" onclick="layer=0;paint()">1</button><button class="${layer===1?'on':''}" onclick="layer=1;paint()">2</button></div>`:''}${act('crop','Точные параметры','crop')}${isSplit?act('split','Раскладка','layout'):''}${p.type==='creative'&&stageIndex===0?act('mic','Вступление','intro'):''}${p.type==='creative'&&stageIndex===2?act('book','Комментарии','comments'):''}${construct?act('layers','Сцена','scene'):''}${act('captions','Субтитры','subs')}${act('layers','Вставки','overlay')}${act('audio','Звук','audio')}${act('sliders','Эффекты','processing')}<div class="hint"><b>✦ Помощник</b><p>Проверить кадр, звук и оформление выбранного видео.</p><button style="margin-top:9px;width:100%" onclick="openAI()">Рекомендации</button></div></aside></div>`}
function canvasContent(){let x=f();if(!x)return '';let is=p.type==='split',b=p.secondary[0];let media=(file,i)=>{let url=file?.url,tag=file&&!file.demo&&url?`<video id="vid${i}" src="${esc(url)}" preload="metadata" muted></video>`:file?.demo&&url?`<img src="${url}">`:'<div class="missingmedia">Выбрать видео</div>';return `<div class="half" data-i="${i}" id="half${i}">${tag}</div>`};return media(x,0)+(is?media(b,1)+'<div class="divider" id="divider"></div>':'')+(p.subs?`<div class="subpreview">${esc(x.subtitle||'Пример субтитров')}</div>`:'')+(p.type==='creative'&&stageIndex===2?'<div style="position:absolute;bottom:8%;left:7%;right:7%;padding:15px;background:#e7e9ef;color:#30343a;border-radius:7px;z-index:5;font-size:12px">'+esc(x.comments[0]||'Комментарий · пример')+'</div>':'')}
function resize(){let s=$('stage'),c=$('canvas');if(!s||!c)return;let [w,h]=p.format.split(':').map(Number),ratio=w/h;let W=s.clientWidth-34,H=s.clientHeight-34;let cw=Math.min(W,H*ratio),ch=cw/ratio;c.style.width=Math.max(1,cw)+'px';c.style.height=Math.max(1,ch)+'px';paint()}function paint(){let x=f(),c=$('canvas');if(!x||!c)return;let split=p.type==='split',vert=p.layout==='vertical';for(let i=0;i<(split?2:1);i++){let el=$('half'+i);if(!el)continue;let r=split?(i===0?p.split:1-p.split):1;el.style.left=split&&!vert&&i===1?p.split*100+'%':'0';el.style.top=split&&vert&&i===1?p.split*100+'%':'0';el.style.width=split&&!vert?r*100+'%':'100%';el.style.height=split&&vert?r*100+'%':'100%';el.classList.toggle('selected',i===layer);let t=x.trans[i];el.firstElementChild.style.transform=`translate(${t.x}px,${t.y}px) scale(${t.scale})`;}let d=$('divider');if(d){d.style.cssText=vert?`top:calc(${p.split*100}% - 2px);left:0;width:100%;height:4px`:`left:calc(${p.split*100}% - 2px);top:0;height:100%;width:4px;cursor:ew-resize`}}
function bindCanvas(){let c=$('canvas');if(!c)return;resize();for(let el of c.querySelectorAll('.half')){let i=+el.dataset.i;el.onpointerdown=e=>{layer=i;paint();el.setPointerCapture(e.pointerId);let x=e.clientX,y=e.clientY,t=f().trans[i],ox=t.x,oy=t.y;el.onpointermove=ev=>{t.x=ox+ev.clientX-x;t.y=oy+ev.clientY-y;paint()};el.onpointerup=el.onpointercancel=()=>{el.onpointermove=null}};el.onwheel=e=>{e.preventDefault();layer=i;let t=f().trans[i];t.scale=Math.max(.2,Math.min(4,t.scale*(e.deltaY<0?1.07:.93)));paint()}}let d=$('divider');if(d)d.onpointerdown=e=>{d.setPointerCapture(e.pointerId);d.onpointermove=ev=>{let b=c.getBoundingClientRect();p.split=Math.max(.25,Math.min(.75,p.layout==='vertical'?(ev.clientY-b.top)/b.height:(ev.clientX-b.left)/b.width));paint()};d.onpointerup=d.onpointercancel=()=>d.onpointermove=null};let v=$('vid0');if(v){v.ontimeupdate=()=>{if(v.duration){$('seek').value=100*v.currentTime/v.duration;$('time').textContent=new Date(v.currentTime*1000).toISOString().slice(14,19)}}}}
function playToggle(){let vs=[...document.querySelectorAll('.canvas video')];if(!vs.length){notify('Демо использует неподвижные кадры. Добавь MP4 для воспроизведения.');return}if(vs[0].paused)vs.forEach(v=>v.play().catch(()=>{}));else vs.forEach(v=>v.pause())}function seek(v){document.querySelectorAll('.canvas video').forEach(x=>{if(x.duration)x.currentTime=x.duration*v/100})}function fullScreen(){let s=$('stage');if(s.requestFullscreen)s.requestFullscreen().catch(()=>notify('Полноэкранный режим недоступен'))}window.addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);

function home(){let saved=projects.length>0;return headerBar('ClipFlow')+`<div class="content"><section class="hero panel"><div class="iconBig">${I('logo')}</div><div class="flex"><h1>${saved?'Мои проекты':'Создать видео'}</h1><p>${saved?'Открой шаблон и добавь материалы.':'Выбери сценарий. Настройки сохранятся.'}</p></div><button class="primary" onclick="chooseRecipe()">+ Новый проект</button></section>${saved?`<section class="section"><div class="savedcards">${projects.map((x,i)=>quickCard(recipes.find(r=>r.id===x.type).i,esc(x.name),`${x.format} · ${x.files.length} видео`, `openProject(${i})`)).join('')}<button class="quickcard newsetup" onclick="chooseRecipe()"><div class="qicon">＋</div><h3>Новый проект</h3></button></div></section>`:`<section class="section"><h2>Сценарии</h2><div class="recipes">${recipes.map(r=>`<button class="recipe" onclick="newProject('${r.id}')"><div class="art">${art(r.id)}</div><div class="copy"><h3>${r.name}</h3><p>${r.desc}</p></div></button>`).join('')}</div></section>`}<section class="section"><button class="ghost" onclick="demoProject('creative')">Посмотреть демо →</button></section></div>`}
function editor(){let old=oldEditor();let idx=old.indexOf('<aside class="inspector">');let is=p.type==='split',construct=p.type==='construct';let bar=`<div class="editbar"><select class="mobilefile" aria-label="Выбрать видео" onchange="selectFile(+this.value)">${p.files.map((x,i)=>`<option value="${i}" ${selected===i?'selected':''}>${esc(x.name)}</option>`).join('')||'<option>Нет видео</option>'}</select>${is?`<button onclick="openSettings('layout')">${I('split')} Раскладка</button>`:''}${construct?`<button onclick="openSettings('scene')">${I('layers')} Сцена</button><button onclick="openSettings('layerNew')">+ Слой</button>`:''}${p.type==='creative'&&stageIndex===0?`<button onclick="openSettings('intro')">${I('mic')} Вступление</button>`:''}${p.type==='creative'&&stageIndex===2?`<button onclick="openSettings('comments')">${I('book')} Комментарии</button>`:''}<div class="editspacer"></div><button class="ghost" title="Точные параметры" onclick="openSettings('crop')">${I('crop')}</button></div>`;return old.slice(0,idx).replace('<section class="center">','<section class="center">'+bar)+'</div>'}
// All template settings are centralized and only shown on request.
function settingsMenu(){let items=[['settings','Мастер настройки','startSetup()'],['audio','Звук','openSound()'],['captions','Субтитры',"openSettings('subs')"],['layers','Вставки',"openSettings('overlay')"],['sliders','Обработка',"openSettings('processing')"],['settings','Экспорт',"openSettings('export')"]];if(['split','construct'].includes(p.type))items.push(['history','Правила связок',"openSettings('rules')"]);if(p.type==='split')items.push(['split','Раскладка',"openSettings('layout')"]);if(['creative','translate','story'].includes(p.type))items.push(['lang','Язык',"openSettings('translation')"]);modal('Шаблон',`<div class="recipemenu">${items.map(([i,t,a])=>quickCard(i,t,'',`closeModal();${a}`)).join('')}</div>`,null)}
// Save prototype state on explicit modal apply. Cancel does not invoke callbacks.
const originalApply=$('apply').onclick;$('apply').onclick=()=>{originalApply();if(p&&p.settings.setupDone&&tab!=='setup')persist()};
// Save template choice and material references when leaving project (files must be reselected after browser reload).
const originalGo=go;go=function(id){if(p&&p.settings.setupDone&&tab!=='setup')persist();originalGo(id)};
function setupFinish(){persist()}

function startAssembly(){if(!p.files.length){modal('Добавь видео','<p>Для начала нужны исходные материалы.</p>',null);return}if(p.type==='split'&&!p.secondary.length){modal('Нужны вторые видео','<p>Добавь материалы для второй половины.</p>',null);return}let missing=p.type==='creative'?p.files.filter(x=>!x.comment).length:0;if(missing){modal('Нужны комментарии',`<p>${missing} видео ещё не готовы.</p><button class="primary" onclick="closeModal();selected=p.files.findIndex(x=>!x.comment);changeTab('files');openSettings('comments')">Добавить комментарии →</button>`,null);return}if(p.files.some(x=>!x.url&&!x.demo)){modal('Материалы','<p>После повторного открытия HTML выбери локальные видео заново. В Windows используются сохранённые пути.</p>',null);return}let count=['split','construct'].includes(p.type)?p.settings.cnt||10:p.files.length;modal('Готово к сборке',`<div class="setupdetail"><div class="row between"><span>Запрошено роликов</span><b>${count}</b></div><div class="row between"><span>Формат</span><b>${p.format}</b></div><div class="row between"><span>Папка</span><b>${esc(p.settings.out||'По умолчанию')}</b></div></div><button class="ghost" onclick="closeModal();openSettings('export')">Изменить экспорт ›</button><p class="small muted">Демонстрация интерфейса. Запуск FFmpeg и проверка доступных связок будут выполняться действующим движком.</p>`,()=>{notify('Демо: реальный рендер не подключён')},'Запустить')}
try{let saved=JSON.parse(localStorage.getItem('clipflow-draft')||'[]');if(Array.isArray(saved))projects=saved}catch(e){}render();</script></body></html>
